<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* « SUR UNE JOURNÉE » est affiché en permanence et jamais animé :
         c'est la condition de vérité du plan, pas une décoration. Sans elle
         la comparaison est fausse (un aliment isolé donne l'inverse). */
      #b-head { position: absolute; top: 175px; left: 90px; right: 90px; text-align: center; }
      #b-cols {
        position: absolute; bottom: 560px; left: 0; width: 1080px; height: 700px;
        display: flex; justify-content: center; align-items: flex-end; gap: 190px;
      }
      .b-col { display: flex; flex-direction: column; align-items: center; width: 250px; }
      .b-bar { width: 250px; border-radius: 16px 16px 0 0; height: 0; }
      .b-num { font-size: 132px; font-weight: 900; line-height: 1; margin-bottom: 26px; opacity: 0; font-variant-numeric: tabular-nums; }
      .b-name { position: absolute; bottom: 470px; width: 250px; text-align: center; font-size: 40px; font-weight: 800; opacity: 0; }
      /* La ligne de sol est commune aux deux colonnes : c'est elle qui rend
         la comparaison honnête. Même origine, même échelle, même unité. */
      #b-floor { position: absolute; bottom: 558px; left: 190px; width: 700px; height: 4px; background: var(--ink-faint); opacity: 0.35; }
      #b-unit { position: absolute; bottom: 500px; left: 0; width: 1080px; text-align: center; font-size: 34px; font-weight: 700; color: var(--ink-soft); opacity: 0; }
      #b-x2 {
        position: absolute; top: 620px; left: 0; width: 1080px; text-align: center;
        font-size: 170px; font-weight: 900; color: var(--good); opacity: 0;
      }
      #b-line {
        position: absolute; top: 1430px; left: 80px; right: 80px; text-align: center;
        font-size: 52px; font-weight: 800; line-height: 1.25; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-o5x7" id="b-root" data-composition-id="digestion-vs-sport" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div data-hf-id="hf-e0t1" id="b-scene" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div data-hf-id="hf-tan6" class="stage">
          <div data-hf-id="hf-zz3s" id="b-head">
            <div data-hf-id="hf-5y0c" class="kicker">Sur une journée entière</div>
          </div>

          <div data-hf-id="hf-my9x" id="b-x2">×2</div>

          <div data-hf-id="hf-kagv" id="b-cols">
            <div data-hf-id="hf-74l3" class="b-col">
              <div data-hf-id="hf-ggnk" class="b-num" id="b-num-tef" style="color: var(--tef-ink)">10</div>
              <div data-hf-id="hf-w7yn" class="b-bar" id="b-bar-tef" style="background: var(--tef)"></div>
              <div data-hf-id="hf-qv9q" class="b-name" id="b-name-tef">DIGESTION</div>
            </div>
            <div data-hf-id="hf-y96f" class="b-col">
              <div data-hf-id="hf-rqih" class="b-num" id="b-num-sport" style="color: var(--sport)">5</div>
              <div data-hf-id="hf-fxxr" class="b-bar" id="b-bar-sport" style="background: var(--sport)"></div>
              <div data-hf-id="hf-w7kb" class="b-name" id="b-name-sport">SPORT</div>
            </div>
          </div>

          <div data-hf-id="hf-wx9k" id="b-floor"></div>
          <div data-hf-id="hf-yb4m" id="b-unit">% de ce que tu brûles en 24 h</div>

          <div data-hf-id="hf-4vl4" id="b-line">deux fois plus à <span data-hf-id="hf-769b" class="hl-good">digérer</span><br data-hf-id="hf-x5px">qu'à <span data-hf-id="hf-7wks" class="hl-bad">s'entraîner</span></div>
        </div>
      </div>

      <!-- SON — volumes du skill montage-capcut (§6). Le « correct » du ×2 est
           le troisième palier de l'escalade wrong/correct de la vidéo (§4). -->
      <audio data-hf-id="hf-f0k1" id="sfx-b-01-pop" src="assets/sfx/pop.mp3" data-start="0.60" data-duration="0.14" data-track-index="20" data-volume="0.95"></audio>
      <audio data-hf-id="hf-buom" id="sfx-b-02-pop" src="assets/sfx/pop.mp3" data-start="0.85" data-duration="0.14" data-track-index="21" data-volume="0.95"></audio>
      <audio data-hf-id="hf-70mg" id="sfx-b-03-click" src="assets/sfx/click.mp3" data-start="1.95" data-duration="0.05" data-track-index="22" data-volume="0.95"></audio>
      <audio data-hf-id="hf-xxap" id="sfx-b-04-click" src="assets/sfx/click.mp3" data-start="2.15" data-duration="0.05" data-track-index="23" data-volume="0.95"></audio>
      <audio data-hf-id="hf-tmx6" id="sfx-b-05-correct" src="assets/sfx/correct.mp3" data-start="3.35" data-duration="0.55" data-track-index="24" data-volume="0.75"></audio>
      <audio data-hf-id="hf-m7hw" id="sfx-b-06-click" src="assets/sfx/click.mp3" data-start="4.30" data-duration="0.05" data-track-index="25" data-volume="0.95"></audio>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Hauteurs reprises telles quelles de 01-decoupe-tdee : 960 px = 100 %.
        // Garder ce rapport, sinon le ×2 ne se lit plus à l'œil.
        const UNIT = 9.6; // px par point de pourcentage
        const H_TEF = 10 * UNIT * 2.4;   // 230 px
        const H_SPORT = 5 * UNIT * 2.4;  // 115 px

        // Calé sur la voix, syllabe par syllabe :
        //   0.6 « Sur une journée entière, »   1.9 « tu brûles deux fois plus de calories »
        //   4.2 « à digérer ce que tu manges » 6.2 « qu'à t'entraîner. »
        tl.from("#b-head .kicker", { opacity: 0, y: 20, duration: 0.4 }, 0);
        tl.to("#b-floor", { opacity: 0.35, duration: 0.3 }, 0.3);

        // Les deux blocs se posent sur le sol commun pendant « sur une journée entière »
        tl.to("#b-bar-tef", { height: H_TEF, duration: 0.5, ease: "power3.out" }, 0.55);
        tl.to("#b-bar-sport", { height: H_SPORT, duration: 0.5, ease: "power3.out" }, 0.8);

        tl.to("#b-name-tef", { opacity: 1, duration: 0.3 }, 1.9);
        tl.to("#b-name-sport", { opacity: 1, duration: 0.3 }, 2.1);
        tl.to("#b-num-tef", { opacity: 1, duration: 0.35 }, 1.9);
        tl.from("#b-num-tef", { y: 18, duration: 0.35 }, 1.9);
        tl.to("#b-num-sport", { opacity: 1, duration: 0.35 }, 2.1);
        tl.from("#b-num-sport", { y: 18, duration: 0.35 }, 2.1);
        tl.to("#b-unit", { opacity: 1, duration: 0.35 }, 2.5);

        // « deux fois plus » — le ×2 tombe exactement sur ces trois mots
        tl.fromTo("#b-x2", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 3.3);

        // « à digérer ce que tu manges » puis « qu'à t'entraîner »
        tl.to("#b-line", { opacity: 1, duration: 0.4 }, 4.25);
        tl.from("#b-line", { y: 22, duration: 0.4 }, 4.25);

        window.__timelines["digestion-vs-sport"] = tl;
      })();
    </script>
  </body>
</html>
