<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=960">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <link rel="stylesheet" href="compositions/components/youbud.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/vendor/lucide.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* Le cadre B de « Tu manges moins, et tu craques au bout d'une semaine ? » : 1080 x 960, posé en
         haut de l'image, Mohamed en petit dessous. Le titre fixe vit au-dessus de y = 230 : le contenu
         utile reste entre y = 230 et y = 940.
         Deux éléments et un chiffre : l'assiette (à gauche), la jauge Faim (à droite), et « + ½ ».
         La portion rétrécit un peu (un déficit), beaucoup (trop d'un coup), puis revient plus grosse
         qu'avant (le repas d'après). La teinte pâle sous la portion garde la taille normale en repère.
         Aucune bordure : des teintes claires à rebord plein. */
      .clip.scene-b { width: 1080px; height: 960px; }
      .toile { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; display: block; }
      .lab { position: absolute; font-size: 60px; font-weight: 900; line-height: 1; color: var(--ink);
        text-align: center; white-space: nowrap; }
      .ico { position: absolute; color: var(--ink); }
      .ico svg.lucide { display: block; width: 100%; height: 100%; }

      /* 1 · L'assiette : bleu clair (le blanc se perdrait sur la toile), le creux blanc, la taille
         normale en orange pâle, et la portion orange avec son sandwich par-dessus. */
      #b1-assiette { position: absolute; left: 180px; top: 360px; width: 460px; height: 460px; border-radius: 50%;
        background: var(--yb-blue-2); box-shadow: 0 12px 0 #b9e1f6; opacity: 0; will-change: transform; }
      #b1-assiette .creux { position: absolute; left: 60px; top: 60px; width: 340px; height: 340px;
        border-radius: 50%; background: #ffffff; }
      #b1-trace { position: absolute; left: 120px; top: 120px; width: 220px; height: 220px; border-radius: 50%;
        background: #ffe2b8; }
      #b1-portion { position: absolute; left: 120px; top: 120px; width: 220px; height: 220px; border-radius: 50%;
        background: var(--yb-orange); box-shadow: 0 8px 0 var(--yb-orange-edge); will-change: transform; }
      #b1-portion .ico { left: 50px; top: 50px; width: 120px; height: 120px; color: #ffffff; }

      /* 2 · La jauge Faim : une piste blanche à rebord, le rouge monte dedans (un bloc qui glisse
         vers le haut dans un creux arrondi : aucune hauteur animée). */
      #b1-jauge { position: absolute; left: 770px; top: 320px; width: 124px; height: 450px; border-radius: 62px;
        background: #ffffff; box-shadow: 0 10px 0 #d9d8d0; opacity: 0; will-change: transform; }
      #b1-jauge .creux { position: absolute; left: 14px; top: 14px; width: 96px; height: 422px;
        border-radius: 48px; overflow: hidden; background: #f1f0ea; }
      #b1-rouge { position: absolute; left: 0; top: 0; width: 96px; height: 422px; background: var(--yb-red);
        will-change: transform; }
      #b1-faim { left: 682px; top: 806px; width: 300px; opacity: 0; }

      /* Le chiffre : « + ½ », la seule pilule colorée, au coin de l'assiette. */
      #b1-moitie { position: absolute; left: 500px; top: 290px; width: 190px; height: 104px; line-height: 104px;
        border-radius: 999px; background: var(--yb-yellow); box-shadow: 0 8px 0 var(--yb-yellow-edge);
        font-size: 66px; font-weight: 900; color: var(--ink); text-align: center;
        font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; will-change: transform; }
    </style>
  </head>
  <body>
    <!-- Les bruitages : un soft_click par élément qui se pose (l'assiette, Faim, « + ½ »), au volume
         du Kallaway edit (1 × 0,6). Rien d'autre. Les data-start reprennent l'objet CUES du script :
         les changer ensemble. -->
    <div id="b1-root" data-composition-id="deficit-trop-grand-b1" data-start="0" data-duration="15.67" data-width="1080" data-height="960">
      <div id="b1-scene" class="clip scene-b" data-start="0" data-duration="15.67" data-track-index="0">
        <img class="toile" src="assets/img/toile.jpg" alt="">

        <div id="b1-assiette">
          <div class="creux"></div>
          <div id="b1-trace"></div>
          <div id="b1-portion"><div class="ico"><i data-lucide="sandwich"></i></div></div>
        </div>

        <div id="b1-jauge">
          <div class="creux"><div id="b1-rouge" data-layout-allow-overflow></div></div>
        </div>
        <div class="lab" id="b1-faim">Faim</div>

        <div id="b1-moitie">+ ½</div>
      </div>

      <audio id="b1-s-01" src="assets/sfx/soft_click.wav" data-start="0.63" data-duration="0.22" data-track-index="11" data-volume="0.6"></audio>
      <audio id="b1-s-02" src="assets/sfx/soft_click.wav" data-start="6.11" data-duration="0.22" data-track-index="12" data-volume="0.6"></audio>
      <audio id="b1-s-03" src="assets/sfx/soft_click.wav" data-start="12" data-duration="0.22" data-track-index="13" data-volume="0.6"></audio>
    </div>

    <script>
      (function () {
        // Les repères : mot du texte B → seconde, depuis le début du temps B (« Un déficit… »).
        // Estimés à 4,75 mots par seconde avant le tournage (rang du mot − 1, ÷ 4,75 ; 73 mots en tout).
        // Après le tournage, `ke.py … plans` donne les vrais temps : recaler chaque valeur sur sa syllabe,
        // reporter manger, faim et plus dans les data-start des trois <audio>, et fin + 0,3 dans les
        // deux data-duration (la racine et la scène).
        var CUES = {
          manger: 0.63,   // « c'est manger moins » (4e mot) : l'assiette et sa portion, un clic
          moins: 0.84,    // « manger moins » (5e) : la portion rétrécit un peu (0,9), sans clic
          trop: 5.05,     // « tu as enlevé trop d'un coup » (25e) : elle rétrécit beaucoup (0,607), sans clic
          faim: 6.11,     // « et ta faim s'est réveillée » (30e) : la jauge Faim, le rouge monte à moitié, un clic
          petits: 9.05,   // « presque trois fois plus petits » (44e) : la petite portion se serre une fois, sans clic
          faim2: 10.32,   // « des femmes ont eu plus faim » (50e) : le rouge monte à 0,82, sans clic
          repas: 10.74,   // « Au repas d'après » (52e) : la portion revient à sa taille normale, sans clic
          moitie: 11.79,  // « moitié plus » (57e) : la portion dépasse la taille normale (1,245), sans clic
          plus: 12.0,     // « moitié plus » (58e) : le « + ½ », un clic
          gagne: 14.74,   // « c'est ta faim qui gagne » (71e) : la jauge bat une fois, sans clic
          fin: 15.37      // fin de « gagne » (73 mots) : la composition dure fin + 0,3 s ; tout est immobile dès 15,1
        };

        if (window.lucide) window.lucide.createIcons();

        // Le rouge de la jauge : un bloc de 422 px qui monte dans son creux. Niveau n → y = 422 × (1 − n).
        var H = 422;

        var tl = gsap.timeline({ paused: true });

        // 1 · L'assiette et sa portion, sur « manger » ; la portion rétrécit un peu sur « moins ».
        tl.fromTo("#b1-assiette", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, CUES.manger);
        tl.fromTo("#b1-portion", { scale: 1 }, { scale: 0.9, duration: 0.45, ease: "power2.inOut", immediateRender: false }, CUES.moins);

        // « trop d'un coup » : elle rétrécit beaucoup. 0,607 de diamètre = une aire 2,7 fois plus petite,
        // le rapport de l'étude (1 025 kJ contre 2 778 kJ par repas).
        tl.fromTo("#b1-portion", { scale: 0.9 }, { scale: 0.607, duration: 0.5, ease: "power2.inOut", immediateRender: false }, CUES.trop);

        // 2 · La jauge Faim, sur « faim » ; le rouge monte à moitié.
        tl.fromTo("#b1-jauge", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, CUES.faim);
        tl.fromTo("#b1-faim", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, CUES.faim + 0.1);
        tl.fromTo("#b1-rouge", { y: H }, { y: H * 0.5, duration: 0.6, ease: "power2.out" }, CUES.faim + 0.2);

        // « presque trois fois plus petits » : la petite portion se serre une fois et revient.
        tl.fromTo("#b1-portion", { scale: 0.607 }, { scale: 0.56, duration: 0.16, ease: "power1.inOut", yoyo: true, repeat: 1, immediateRender: false }, CUES.petits);

        // « plus faim » : le rouge monte à 0,82.
        tl.fromTo("#b1-rouge", { y: H * 0.5 }, { y: H * 0.18, duration: 0.5, ease: "power2.out", immediateRender: false }, CUES.faim2);

        // « Au repas d'après » : la portion revient à la taille normale ; sur « moitié », elle la dépasse :
        // 1,245 de diamètre = une aire 1,55 fois plus grande, le rapport mesuré au buffet (3 965 kJ contre 2 560 kJ).
        tl.fromTo("#b1-portion", { scale: 0.607 }, { scale: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, CUES.repas);
        tl.fromTo("#b1-portion", { scale: 1 }, { scale: 1.245, duration: 0.45, ease: "power2.out", immediateRender: false }, CUES.moitie);

        // Le chiffre : « + ½ », sur « plus ».
        tl.fromTo("#b1-moitie", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUES.plus);

        // « c'est ta faim qui gagne » : la jauge bat une fois. Fini à 15,1 s ; ensuite, plus rien ne bouge.
        tl.fromTo("#b1-jauge", { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power1.inOut", yoyo: true, repeat: 1, immediateRender: false }, CUES.gagne);

        window.__timelines["deficit-trop-grand-b1"] = tl;
      })();
    </script>
  </body>
</html>
