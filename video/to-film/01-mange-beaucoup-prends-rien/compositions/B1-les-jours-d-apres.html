<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=960">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <link rel="stylesheet" href="compositions/components/youbud.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/vendor/lucide.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* Le cadre B du format court : 1080 x 960, posé en haut de l'image, Mohamed en petit dessous.
         Le titre fixe de la vidéo occupe y 250 -> 400 : tout le contenu vit entre y = 440 et y = 930. */
      .clip.scene-b { width: 1080px; height: 960px; }
      .toile { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; display: block; }
      #b1-t1, #b1-t2 { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; will-change: transform; }

      /* ---------- Tableau 1 · ta semaine ---------- */

      /* La carte de la semaine : sept barres (ce que tu manges chaque jour) contre une ligne (ce que tu dépenses). */
      #b1-semaine { left: 60px; top: 450px; width: 960px; height: 460px; --tint: #ffffff; --edge: #e5e5e0; }
      /* Une barre = une colonne verte sous la ligne, jaune au-dessus (le surplus), qu'un cache blanc recouvre
         depuis le haut : on règle la hauteur visible en tournant le cache (scaleY), jamais un height tweené.
         La ligne est à 180 px du bas des colonnes. */
      .b1-col { position: absolute; top: 60px; width: 84px; height: 360px; overflow: hidden; will-change: transform;
        background: linear-gradient(to top, var(--yb-green) 0, var(--yb-green) 180px, var(--yb-yellow) 180px, var(--yb-yellow) 100%); }
      .b1-cache { position: absolute; left: 0; top: 0; width: 84px; height: 360px; background: #ffffff; will-change: transform; }
      .b1-jour { position: absolute; top: 424px; width: 84px; font-family: "Archivo", sans-serif; font-size: 28px; font-weight: 900;
        line-height: 30px; text-align: center; color: var(--ink-faint); }
      /* La ligne de ce que tu dépenses, en pointillés orange, et sa flamme. */
      #b1-ligne { position: absolute; left: 108px; top: 237px; width: 836px; height: 6px; border-radius: 3px;
        background: repeating-linear-gradient(to right, var(--yb-orange) 0, var(--yb-orange) 22px, transparent 22px, transparent 36px); }
      #b1-flamme { position: absolute; left: 28px; top: 208px; width: 64px; height: 64px; color: var(--yb-orange-edge); will-change: transform; }
      #b1-flamme svg.lucide { display: block; width: 100%; height: 100%; stroke-width: 2.6; }
      /* Le trop : un bloc rouge sur le dimanche, pour « pas énorme ». */
      #b1-trop { position: absolute; left: 852px; top: 120px; width: 84px; height: 90px; border-radius: 14px 14px 0 0;
        background: var(--yb-red); will-change: transform; }
      /* La rangée du haut : le « + », la pilule des mois, la coche, la croix. */
      #b1-plus { position: absolute; left: 150px; top: 16px; width: 90px; height: 90px; border-radius: 50%;
        background: var(--yb-yellow); box-shadow: 0 6px 0 var(--yb-yellow-edge); opacity: 0; will-change: transform; }
      #b1-plus svg { display: block; width: 90px; height: 90px; }
      #b1-mois { position: absolute; left: 262px; top: 20px; width: 236px; height: 82px; border-radius: 41px;
        background: var(--yb-yellow-2); box-shadow: 0 6px 0 #efe2a8; opacity: 0; will-change: transform; }
      #b1-mois .b1-cal { position: absolute; left: 24px; top: 17px; width: 48px; height: 48px; color: var(--yb-yellow-edge); }
      #b1-mois .b1-cal svg.lucide { display: block; width: 100%; height: 100%; stroke-width: 2.6; }
      #b1-mois span { position: absolute; left: 82px; top: 0; font-family: "Archivo", sans-serif; font-size: 48px; font-weight: 900;
        line-height: 82px; color: var(--ink); white-space: nowrap; }
      #b1-coche { left: 540px; top: 12px; }
      #b1-croix { left: 740px; top: 12px; }

      /* ---------- Tableau 2 · les aliments denses contre la salade ---------- */

      /* Les aliments denses : petits, et la jauge presque pleine. Carte verte : ce qui marche. */
      #b1-denses { left: 60px; top: 450px; width: 450px; height: 460px; opacity: 0; --tint: var(--yb-green-2); --edge: #c8e9ad; }
      .b1-aliment { position: absolute; opacity: 0; will-change: transform; }
      .b1-aliment svg { display: block; width: 100%; height: 100%; }
      #b1-beurre { left: 25px; top: 205px; width: 120px; height: 100px; }
      #b1-avocat { left: 165px; top: 135px; width: 120px; height: 170px; }
      #b1-noix { left: 305px; top: 215px; width: 120px; height: 90px; }
      /* La salade : un grand bol, presque rien dans la jauge. Carte bleue : c'est surtout de l'eau. */
      #b1-salade { left: 570px; top: 450px; width: 450px; height: 460px; opacity: 0; --tint: var(--yb-blue-2); --edge: #b9e1f6; }
      #b1-bol { position: absolute; left: 60px; top: 22px; width: 330px; height: 330px; display: block; }
      /* Les jauges : une piste blanche, un remplissage qui glisse dedans (jamais un width tweené) ;
         il dépasse à gauche de sa piste, qui le coupe : c'est voulu (data-layout-allow-overflow). */
      .b1-jauge { position: absolute; left: 45px; top: 382px; width: 360px; height: 44px; border-radius: 22px; background: #ffffff; overflow: hidden; }
      .b1-fill { position: absolute; left: 0; top: 0; width: 360px; height: 44px; border-radius: 22px; will-change: transform; }
      #b1-fill-salade { background: var(--yb-red); border-radius: 0; } /* sans arrondi : le bout visible prend l'arrondi de la piste */
      #b1-fill-denses { background: var(--yb-green); }
    </style>
  </head>
  <body>
    <!-- B1 · « Tu manges beaucoup, et tu ne prends rien ? », le cadre B de la raison (« Comme moi, tu crois manger beaucoup…
         plutôt que des salades. »). Deux tableaux, aucune phrase : ta semaine (sept barres contre la ligne de ce
         que tu dépenses, le « + », les mois, la coche et la croix), puis les aliments denses contre la salade.
         Les temps sont dans CUES. -->
    <div id="b1-root" data-composition-id="mange-beaucoup-b1" data-start="0" data-duration="31.19" data-width="1080" data-height="960">
      <div id="b1-scene" class="clip scene-b" data-start="0" data-duration="31.19" data-track-index="0">
        <img class="toile" src="assets/img/toile.jpg" alt="">

        <!-- Tableau 1 : ta semaine. La carte, la ligne et la flamme sont là dès le glissé ; les barres montent sur la voix. -->
        <div id="b1-t1">
          <div class="yb-card" id="b1-semaine">
            <div class="b1-col" id="b1-col-0" style="left: 120px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-1" style="left: 242px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-2" style="left: 364px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-3" style="left: 486px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-4" style="left: 608px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-5" style="left: 730px;"><div class="b1-cache"></div></div>
            <div class="b1-col" id="b1-col-6" style="left: 852px;"><div class="b1-cache"></div></div>
            <div id="b1-trop"></div>
            <div class="b1-jour" style="left: 120px;">L</div>
            <div class="b1-jour" style="left: 242px;">M</div>
            <div class="b1-jour" style="left: 364px;">M</div>
            <div class="b1-jour" style="left: 486px;">J</div>
            <div class="b1-jour" style="left: 608px;">V</div>
            <div class="b1-jour" style="left: 730px;">S</div>
            <div class="b1-jour" style="left: 852px;">D</div>
            <div id="b1-ligne"></div>
            <div id="b1-flamme"><i data-lucide="flame"></i></div>

            <div id="b1-plus">
              <svg viewBox="0 0 90 90"><path d="M 45 25 V 65 M 25 45 H 65" fill="none" stroke="#3c3c3c" stroke-width="11" stroke-linecap="round"/></svg>
            </div>
            <div id="b1-mois"><div class="b1-cal"><i data-lucide="calendar-days"></i></div><span>Mois</span></div>
            <div class="yb-badge" id="b1-coche"><svg viewBox="0 0 96 96"><path d="M 28 50 L 42 64 L 68 34"/></svg></div>
            <div class="yb-badge ko" id="b1-croix"><svg viewBox="0 0 96 96"><path d="M 32 32 L 64 64 M 64 32 L 32 64"/></svg></div>
          </div>
        </div>

        <!-- Tableau 2 : les aliments denses, puis la salade, dans l'ordre de la voix. -->
        <div id="b1-t2">
          <div class="yb-card" id="b1-denses">
            <div class="b1-aliment" id="b1-beurre">
              <svg viewBox="0 0 120 100">
                <rect x="4" y="52" width="112" height="40" rx="10" fill="#d9d8d0"/>
                <rect x="14" y="26" width="92" height="56" rx="10" fill="#e0ae00"/>
                <rect x="14" y="20" width="92" height="52" rx="10" fill="#ffe27a"/>
                <rect x="22" y="26" width="46" height="10" rx="5" fill="#fff3b8"/>
              </svg>
            </div>
            <div class="b1-aliment" id="b1-avocat">
              <svg viewBox="0 0 120 170">
                <path d="M 60 6 C 86 6 96 44 102 72 C 120 100 118 164 60 164 C 2 164 0 100 18 72 C 24 44 34 6 60 6 Z" fill="#2f7d1f"/>
                <path d="M 60 16 C 80 16 88 48 93 74 C 108 100 106 154 60 154 C 14 154 12 100 27 74 C 32 48 40 16 60 16 Z" fill="#e9f5b0"/>
                <path d="M 60 28 C 76 28 82 54 86 78 C 98 102 96 144 60 144 C 24 144 22 102 34 78 C 38 54 44 28 60 28 Z" fill="#cfe98f"/>
                <circle cx="60" cy="110" r="26" fill="#8a5a2b"/>
                <ellipse cx="52" cy="101" rx="9" ry="7" fill="#b07a45"/>
              </svg>
            </div>
            <div class="b1-aliment" id="b1-noix">
              <svg viewBox="0 0 120 90">
                <ellipse cx="36" cy="58" rx="32" ry="28" fill="#b98a55"/>
                <path d="M 36 32 V 84 M 16 46 Q 24 58 16 70 M 56 46 Q 48 58 56 70" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
                <ellipse cx="86" cy="60" rx="30" ry="27" fill="#c99a62"/>
                <path d="M 86 35 V 85 M 68 48 Q 76 60 68 72 M 104 48 Q 96 60 104 72" fill="none" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
                <ellipse cx="62" cy="30" rx="28" ry="24" fill="#b07a45"/>
                <path d="M 62 8 V 52 M 45 20 Q 52 30 45 40 M 79 20 Q 72 30 79 40" fill="none" stroke="#7a4d22" stroke-width="4" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="b1-jauge"><div class="b1-fill" id="b1-fill-denses" data-layout-allow-overflow></div></div>
          </div>

          <div class="yb-card" id="b1-salade">
            <svg id="b1-bol" viewBox="0 0 400 400">
              <defs>
                <clipPath id="b1-clip-bol"><circle cx="200" cy="200" r="160"/></clipPath>
              </defs>
              <circle cx="200" cy="210" r="188" fill="#b3d9ec"/>
              <circle cx="200" cy="200" r="188" fill="#ffffff"/>
              <circle cx="200" cy="200" r="160" fill="#f1f7f2"/>
              <!-- La salade vue de dessus : des feuilles, du concombre, deux tomates cerises. -->
              <g clip-path="url(#b1-clip-bol)">
                <ellipse cx="200" cy="112" rx="72" ry="36" fill="#46a302"/>
                <ellipse cx="200" cy="292" rx="72" ry="36" fill="#46a302"/>
                <ellipse cx="146" cy="152" rx="74" ry="42" fill="#7ed957" transform="rotate(-30 146 152)"/>
                <ellipse cx="256" cy="146" rx="74" ry="40" fill="#58cc02" transform="rotate(25 256 146)"/>
                <ellipse cx="136" cy="246" rx="70" ry="42" fill="#58cc02" transform="rotate(40 136 246)"/>
                <ellipse cx="262" cy="254" rx="76" ry="42" fill="#7ed957" transform="rotate(-35 262 254)"/>
                <ellipse cx="200" cy="202" rx="84" ry="48" fill="#9be36f" transform="rotate(10 200 202)"/>
                <path d="M 130 205 Q 200 185 270 200" fill="none" stroke="#58cc02" stroke-width="5" stroke-linecap="round"/>
                <circle cx="158" cy="186" r="22" fill="#e2f7cd" stroke="#46a302" stroke-width="6"/>
                <circle cx="248" cy="214" r="22" fill="#e2f7cd" stroke="#46a302" stroke-width="6"/>
                <circle cx="218" cy="156" r="20" fill="#ff4b4b"/>
                <ellipse cx="212" cy="149" rx="7" ry="5" fill="#ff9a9a"/>
                <circle cx="176" cy="262" r="20" fill="#ff4b4b"/>
                <ellipse cx="170" cy="255" rx="7" ry="5" fill="#ff9a9a"/>
              </g>
            </svg>
            <div class="b1-jauge"><div class="b1-fill" id="b1-fill-salade" data-layout-allow-overflow></div></div>
          </div>
        </div>
      </div>

      <!-- Le son : un clic par élément, rien d'autre (soft_click 1,0 × 0,6, le volume du Kallaway edit).
           data-start = CUES.beaucoup, CUES.jour, CUES.equilibre, CUES.chaque, CUES.surplus, CUES.mois, CUES.petit,
           CUES.enorme, CUES.pour, CUES.salades : les recaler en même temps que CUES. Pistes 21 à 30 (B0 a les 11 et 12). -->
      <audio id="b1-s-01" src="assets/sfx/soft_click.wav" data-start="1.20" data-duration="0.22" data-track-index="21" data-volume="0.6"></audio>
      <audio id="b1-s-02" src="assets/sfx/soft_click.wav" data-start="3.94" data-duration="0.22" data-track-index="22" data-volume="0.6"></audio>
      <audio id="b1-s-03" src="assets/sfx/soft_click.wav" data-start="8.57" data-duration="0.22" data-track-index="23" data-volume="0.6"></audio>
      <audio id="b1-s-04" src="assets/sfx/soft_click.wav" data-start="16.78" data-duration="0.22" data-track-index="24" data-volume="0.6"></audio>
      <audio id="b1-s-05" src="assets/sfx/soft_click.wav" data-start="18.04" data-duration="0.22" data-track-index="25" data-volume="0.6"></audio>
      <audio id="b1-s-06" src="assets/sfx/soft_click.wav" data-start="20.78" data-duration="0.22" data-track-index="26" data-volume="0.6"></audio>
      <audio id="b1-s-07" src="assets/sfx/soft_click.wav" data-start="21.41" data-duration="0.22" data-track-index="27" data-volume="0.6"></audio>
      <audio id="b1-s-08" src="assets/sfx/soft_click.wav" data-start="22.04" data-duration="0.22" data-track-index="28" data-volume="0.6"></audio>
      <audio id="b1-s-09" src="assets/sfx/soft_click.wav" data-start="26.47" data-duration="0.22" data-track-index="29" data-volume="0.6"></audio>
      <audio id="b1-s-10" src="assets/sfx/soft_click.wav" data-start="30.68" data-duration="0.22" data-track-index="30" data-volume="0.6"></audio>
    </div>

    <script>
      (function () {
        // LES REPÈRES (mot -> seconde dans la composition). Estimés le 2 octobre, avant le tournage :
        // 4,75 mots par seconde depuis « Comme » (« Comme moi, tu crois manger beaucoup… »), + 0,15 s parce que l'animation
        // démarre 0,15 s avant la coupe (avance_anim du Kallaway edit). Après le tournage, `ke.py … plans`
        // affiche les vrais repères (le temps de chaque mot + 0,15 s) : les recopier ici, puis les data-start
        // des dix <audio>, puis data-duration = CUES.fin + 0,3 (racine et scène).
        var CUES = {
          beaucoup: 1.20,  // « tu crois manger beaucoup »             le lundi monte loin au-dessus de la ligne, en jaune (clic)
          jour: 3.94,      // « Mais le jour d'après »                 les six autres jours montent : trois sous la ligne (clic)
          moins: 6.26,     // « tu manges moins »                      les trois jours sous la ligne battent une fois
          equilibre: 8.57, // « ça s'équilibre »                       le jaune du lundi s'efface (clic)
          moins2: 14.04,   // « ces hommes ont mangé moins »           les trois jours sous la ligne battent une fois
          chaque: 16.78,   // « compte tes calories chaque jour »      les sept jours passent un peu au-dessus de la ligne (clic)
          surplus: 18.04,  // « être en surplus »                      le « + » se pose (clic)
          plus: 19.10,     // « un peu plus »                          le « + » bat une fois
          depenses: 20.15, // « ce que tu dépenses »                   la flamme bat une fois
          mois: 20.78,     // « pendant des mois »                     la pilule Mois se pose (clic)
          petit: 21.41,    // « Garde un petit surplus »               la coche verte se pose et se dessine (clic)
          enorme: 22.04,   // « pas énorme »                           le bloc rouge monte sur le dimanche, la croix, la carte encaisse (clic)
          pour: 26.47,     // « Pour manger plus sans te remplir »     le premier tableau est sorti ; les deux cartes entrent (clic)
          denses: 28.36,   // « des aliments denses »                  leur jauge : presque pleine
          beurre: 28.99,   // « comme le beurre »                      le beurre bat une fois
          avocat: 29.20,   // « l'avocat »                             l'avocat bat une fois
          noix: 29.83,     // « ou les noix »                          les noix battent une fois
          salades: 30.68,  // « plutôt que des salades »               la jauge de la salade : presque rien, 7 % (clic)
          fin: 30.89       // fin de « salades »                       puis 0,3 s de tenue : data-duration = 31.19
        };

        if (window.lucide) window.lucide.createIcons();

        var coche = document.querySelector("#b1-coche path");
        var lcoche = coche.getTotalLength() * 1.05;
        gsap.set(coche, { strokeDasharray: lcoche, strokeDashoffset: lcoche });
        var croix = document.querySelector("#b1-croix path");
        var lcroix = croix.getTotalLength() * 1.05;
        gsap.set(croix, { strokeDasharray: lcroix, strokeDashoffset: lcroix });

        // La hauteur visible d'une barre (en px, la ligne à 180) -> l'échelle du cache blanc qui la recouvre.
        function cache(h) { return (360 - h) / 360; }
        var caches = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return "#b1-col-" + i + " .b1-cache"; });
        gsap.set(caches.join(", "), { transformOrigin: "50% 0%" });

        // Un battement : 1 -> 1,14 -> 1, une seule fois.
        function bat(tl, cible, t) {
          tl.fromTo(cible, { scale: 1 }, { scale: 1.14, duration: 0.15, ease: "power1.inOut", yoyo: true, repeat: 1, immediateRender: false }, t);
        }

        var tl = gsap.timeline({ paused: true });

        // Tableau 1 · « Comme moi, tu crois manger beaucoup » : le gros jour. Le lundi monte loin au-dessus de la ligne
        // (le jaune, c'est le surplus).
        tl.fromTo(caches[0], { scaleY: cache(0) }, { scaleY: cache(290), duration: 0.5, ease: "power3.out" }, CUES.beaucoup);

        // « Mais le jour d'après, ton corps te coupe la faim » : les six autres montent ; mardi, mercredi, jeudi
        // restent sous la ligne.
        var hauteurs = [120, 120, 120, 180, 180, 180];
        hauteurs.forEach(function (h, i) {
          tl.fromTo(caches[i + 1], { scaleY: cache(0) }, { scaleY: cache(h), duration: 0.45, ease: "power3.out" }, CUES.jour + i * 0.08);
        });
        // « tu manges moins » : les trois jours sous la ligne battent une fois.
        bat(tl, "#b1-col-1, #b1-col-2, #b1-col-3", CUES.moins);

        // « Au bout de la semaine, ça s'équilibre » : le jaune du lundi s'efface.
        tl.fromTo(caches[0], { scaleY: cache(290) }, { scaleY: cache(180), duration: 0.45, ease: "power2.inOut", immediateRender: false }, CUES.equilibre);

        // La preuve, « ces hommes ont mangé moins d'eux-mêmes » : les trois jours sous la ligne battent encore.
        bat(tl, "#b1-col-1, #b1-col-2, #b1-col-3", CUES.moins2);

        // « Donc compte tes calories chaque jour » : les sept jours passent un peu au-dessus de la ligne, un par un.
        var avant = [180, 120, 120, 120, 180, 180, 180];
        avant.forEach(function (h, i) {
          tl.fromTo(caches[i], { scaleY: cache(h) }, { scaleY: cache(210), duration: 0.35, ease: "power3.out", immediateRender: false }, CUES.chaque + i * 0.1);
        });

        // « être en surplus » : le « + » ; « un peu plus » : il bat ; « ce que tu dépenses » : la flamme bat.
        tl.fromTo("#b1-plus", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUES.surplus);
        bat(tl, "#b1-plus", CUES.plus);
        bat(tl, "#b1-flamme", CUES.depenses);

        // « pendant des mois » : la pilule Mois.
        tl.fromTo("#b1-mois", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUES.mois);

        // « Garde un petit surplus » : la coche verte se pose, puis se dessine.
        tl.fromTo("#b1-coche", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUES.petit);
        tl.fromTo(coche, { strokeDashoffset: lcoche }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, CUES.petit + 0.1);

        // « pas énorme » : le bloc rouge monte sur le dimanche, la croix se pose et se dessine, la carte encaisse.
        tl.fromTo("#b1-trop", { scaleY: 0 }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.4, ease: "power3.out" }, CUES.enorme);
        tl.fromTo("#b1-croix", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, CUES.enorme + 0.1);
        tl.fromTo(croix, { strokeDashoffset: lcroix }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, CUES.enorme + 0.2);
        var secousse = [0, -9, 9, -9, 9, 0];
        for (var s = 0; s < 5; s++) {
          tl.fromTo("#b1-semaine", { x: secousse[s] }, { x: secousse[s + 1], duration: 0.05, ease: "none", immediateRender: false }, CUES.enorme + 0.2 + s * 0.05);
        }

        // Le premier tableau sort juste avant « Pour manger plus ».
        tl.fromTo("#b1-t1", { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.25, ease: "power2.in", immediateRender: false }, CUES.pour - 0.31);

        // Tableau 2 · « Pour manger plus sans te remplir » : la carte verte (le beurre, l'avocat, les noix) et la carte
        // bleue (la salade) entrent ; « denses » : la jauge verte presque pleine ; chaque aliment bat sur son mot.
        tl.fromTo("#b1-denses", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, CUES.pour);
        tl.fromTo(".b1-aliment", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.1 }, CUES.pour + 0.12);
        tl.fromTo("#b1-salade", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" }, CUES.pour + 0.15);
        tl.fromTo("#b1-fill-denses", { x: -360 }, { x: -29, duration: 0.45, ease: "power3.out" }, CUES.denses);
        bat(tl, "#b1-beurre", CUES.beurre);
        bat(tl, "#b1-avocat", CUES.avocat);
        bat(tl, "#b1-noix", CUES.noix);

        // « plutôt que des salades » : la jauge de la salade, presque rien (7 %). Puis la tenue jusqu'à CUES.fin + 0,3.
        tl.fromTo("#b1-fill-salade", { x: -360 }, { x: -335, duration: 0.3, ease: "power3.out" }, CUES.salades);

        window.__timelines["mange-beaucoup-b1"] = tl;
      })();
    </script>
