<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=960">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <link rel="stylesheet" href="compositions/components/youbud.css">
    <link rel="stylesheet" href="compositions/components/assiette.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/vendor/lucide.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* Le sucre, qu'on vient de barrer, et le gras qui prend sa place. */
      #a1b-sucre { left: 80px; top: 300px; width: 300px; height: 130px; opacity: 0; }
      #a1b-sucre b { position: absolute; left: 0; top: 0; width: 300px; height: 130px; line-height: 130px; text-align: center;
        font-size: 56px; font-weight: 900; color: var(--ink); }
      #a1b-trait { position: absolute; left: 50px; top: 60px; width: 200px; height: 10px; border-radius: 5px; background: var(--yb-red); will-change: transform; }
      #a1b-gras { left: 440px; top: 285px; width: 460px; height: 160px; opacity: 0;
        --tint: var(--yb-yellow); --edge: var(--yb-yellow-edge); }
      #a1b-gras b { position: absolute; left: 0; top: 0; width: 460px; height: 160px; line-height: 160px; text-align: center;
        font-size: 100px; font-weight: 900; color: var(--ink); letter-spacing: -0.02em; }
      /* L'huile, le beurre, les sauces : un mot chacun. */
      .gras { top: 520px; width: 260px; height: 300px; opacity: 0; }
      .gras .ico { left: 70px; top: 44px; width: 120px; height: 120px; }
      .gras .lab { left: 0; top: 214px; width: 260px; }
      #a1b-huile .ico { color: var(--yb-yellow-edge); }
      #a1b-sauces .ico { color: var(--yb-orange-edge); }
      #a1b-plaquette { position: absolute; left: 50px; top: 66px; width: 160px; height: 90px; border-radius: 20px;
        background: #ffe07a; box-shadow: 0 8px 0 #eec24a; overflow: hidden; }
      #a1b-plaquette i { position: absolute; left: 0; top: 0; width: 62px; height: 90px; background: #ffffff; display: block; }
    </style>
  </head>
  <body>
    <!-- Les bruitages : volumes × 0,6 le 28 septembre (« réduis le bruit des animations de 40 % »). -->
    <div id="a1b-root" data-composition-id="assiette-i1b-gras" data-start="0" data-duration="2.6" data-width="1080" data-height="960">
      <div id="a1b-scene" class="clip scene-b" data-start="0" data-duration="2.6" data-track-index="0">
        <img class="toile" src="assets/img/toile.jpg" alt="">

        <div class="yb-card t-blanc" id="a1b-sucre"><b>Sucre</b><div id="a1b-trait"></div></div>
        <div class="yb-card" id="a1b-gras"><b>Gras</b></div>

        <div class="yb-card t-jaune gras" id="a1b-huile" style="left: 410px;"><div class="ico"><i data-lucide="droplet"></i></div><div class="lab">Huile</div></div>
        <div class="yb-card t-jaune gras" id="a1b-beurre" style="left: 90px;"><div id="a1b-plaquette"><i></i></div><div class="lab">Beurre</div></div>
        <div class="yb-card t-orange gras" id="a1b-sauces" style="left: 730px;"><div class="ico"><i data-lucide="cooking-pot"></i></div><div class="lab">Sauces</div></div>
      </div>

      <!-- Le son : un accent sur « gras », un clic par mot de la liste. -->
      <audio id="a1b-s-01" src="assets/sfx/clicks.wav" data-start="0.55" data-duration="0.35" data-track-index="21" data-volume="0.57"></audio>
      <audio id="a1b-s-02" src="assets/sfx/soft_click.wav" data-start="0.96" data-duration="0.22" data-track-index="22" data-volume="0.6"></audio>
      <audio id="a1b-s-03" src="assets/sfx/soft_click.wav" data-start="1.54" data-duration="0.22" data-track-index="23" data-volume="0.6"></audio>
      <audio id="a1b-s-04" src="assets/sfx/soft_click.wav" data-start="2.06" data-duration="0.22" data-track-index="24" data-volume="0.6"></audio>
    </div>

    <script>
      (function () {
        if (window.lucide) window.lucide.createIcons();
        var tl = gsap.timeline({ paused: true });

        // Recalé sur la prise du 25 septembre ; 0.00 = 0,15 s avant la coupe.
        // 0.00 : le sucre, déjà dit, se barre et pâlit.
        tl.fromTo("#a1b-sucre", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 0);
        tl.fromTo("#a1b-trait", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 0.05);
        tl.to("#a1b-sucre", { opacity: 0.5, x: -10, duration: 0.25, ease: "power2.out" }, 0.3);

        // 0.55 « le gras » : la grande carte jaune.
        tl.fromTo("#a1b-gras", { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.55);

        // 0.96 « le beurre », 1.54 « l'huile », 2.06 « les sauces ».
        [["#a1b-beurre", 0.96], ["#a1b-huile", 1.54], ["#a1b-sauces", 2.06]].forEach(function (c) {
          tl.fromTo(c[0], { opacity: 0, scale: 0, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "power3.out" }, c[1]);
        });

        window.__timelines["assiette-i1b-gras"] = tl;
      })();
    </script>
  </body>
</html>
