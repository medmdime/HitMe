    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* Le Kallaway edit, écrit par outils/kallaway-edit (ke.py montage) depuis kallaway.toml.
         Ne pas retoucher à la main : changer la fiche et régénérer.
         A : lui en grand. B : l'animation en haut (1080 x 960), lui détouré devant une carte en bas. */
      html, body { width: 1080px; height: 1920px; background: #1a1a1a; }
      .calque { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; will-change: transform; }
      #zoom-a { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; will-change: transform; }
      .fond { position: absolute; left: 0; width: 1080px; height: 960px; display: block; }
      #fond-haut { top: 0; }
      #fond-bas { top: 960px; }
      .hote { position: absolute; left: 0; top: 0; will-change: transform; }
      /* La bande du visage (visage-b.mp4, 1080 x 800) couvre y 1060 -> 1860.
         La carte n'en montre que le fond : aucune bordure, un rebord plein, les coins arrondis. */
      #carte-visage { position: absolute; left: 60px; top: 1240px; width: 960px; height: 620px;
        border-radius: 44px; overflow: hidden; box-shadow: 0 12px 0 rgba(0, 0, 0, 0.12); background: #222; }
      #video-b-fond { position: absolute; left: -60px; top: -180px; width: 1080px; height: 800px; }
      /* Lui, détouré, posé exactement sur la bande : sa tête sort de la carte par le haut. */
      #decoupe { position: absolute; left: 0; top: 1060px; width: 1080px; height: 800px;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.22)); }
      #video-b-perso { position: absolute; left: 0; top: 0; width: 1080px; height: 800px; }
      /* Les mots incrustés sur le cadre A, au-dessus de la tête. */
      .mot { position: absolute; top: 250px; height: 110px; line-height: 110px; padding: 0 40px; border-radius: 30px;
        font-size: 70px; font-weight: 900; white-space: nowrap; opacity: 0; will-change: transform; text-align: center; color: var(--ink); }
      .incruste-rond { position: absolute; top: 250px; width: 110px; height: 110px; border-radius: 55px; color: var(--ink);
        opacity: 0; will-change: transform; }
      .incruste-rond .ico { position: absolute; left: 27px; top: 27px; width: 56px; height: 56px; }
      .incruste-rond .ico svg.lucide { display: block; width: 100%; height: 100%; }
      #mot-sucre { left: 330px; width: 420px; background: #ffffff; box-shadow: 0 9px 0 #d9d8d0; }
      #mot-sucre .barre { position: absolute; left: 50px; top: 50px; width: 320px; height: 12px; border-radius: 6px; background: var(--yb-red); }
      #mot-gras { left: 355px; width: 370px; background: var(--yb-yellow); box-shadow: 0 9px 0 var(--yb-yellow-edge); }
      #pilule-etude { left: 250px; width: 580px; background: #ffffff; box-shadow: 0 9px 0 #d9d8d0; font-size: 60px; }
      #pilule-120 { left: 380px; width: 320px; background: var(--yb-yellow); box-shadow: 0 9px 0 var(--yb-yellow-edge); font-variant-numeric: tabular-nums; }
      #nom { left: 290px; width: 500px; background: #ffffff; box-shadow: 0 9px 0 #d9d8d0; }
      #bouton-abonne { left: 250px; width: 470px; background: var(--yb-green); box-shadow: 0 9px 0 var(--yb-green-edge); }
      #icone-enregistre { left: 750px; background: var(--yb-yellow); box-shadow: 0 9px 0 var(--yb-yellow-edge); }
