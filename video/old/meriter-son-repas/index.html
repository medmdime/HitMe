    <link rel="stylesheet" href="compositions/components/kit.css">

    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;

      }
      html, body { background: var(--bg); }

  <body>
    <!--
      Enchaînement de relecture UNIQUEMENT : les 56 s d'animation bout à bout,
      pour vérifier le rythme et le son. Le montage final se fait dans CapCut,
      où chaque composition est rendue séparément et posée à son timecode :

        0:17  ->  01-decoupe-tdee        (16 s)
        0:35  ->  02-digestion-vs-sport  (7 s)
        0:49  ->  03-les-trois-leviers   (25 s)

      Entre les trois, ce sont les plans face caméra. Voir SCRIPT.md § 2.
    -->
    <div data-hf-id="hf-ce21" id="root" data-composition-id="main" data-start="0" data-duration="56" data-width="1080" data-height="1920">
      <div data-hf-id="hf-dnvu" id="host-decoupe-tdee" data-composition-id="decoupe-tdee" class="clip" data-start="0" data-duration="18" data-track-index="0" data-composition-src="compositions/01-decoupe-tdee.html"></div>

      <div data-hf-id="hf-4koo" id="host-digestion-vs-sport" data-composition-id="digestion-vs-sport" class="clip" data-start="18" data-duration="8" data-track-index="0" data-composition-src="compositions/02-digestion-vs-sport.html"></div>

      <div data-hf-id="hf-cynv" id="host-trois-leviers" data-composition-id="trois-leviers" class="clip" data-start="26" data-duration="30" data-track-index="0" data-composition-src="compositions/03-les-trois-leviers.html"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
