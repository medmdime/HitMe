<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="compositions/components/splitbar.js"></script>
    <style>
      /* Déclarée dans le document, pas dans kit.css : les HTML sont servis
         avec la racine du projet comme base, donc ce chemin est le seul que
         le lint et le runtime résolvent pareil (cf. commentaire kit.css). */
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      .num {
        position: absolute;
        top: 0;
        width: 96px;
        height: 96px;
        border-radius: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 52px;
        font-weight: 900;
        color: #fff;
      }
      #d1-n1 {
        left: 250px;
        background: var(--in);
      }
      #d1-n2 {
        left: 734px;
        background: var(--out);
      }
      #d1-head {
        position: absolute;
        top: 210px;
        left: 0;
        right: 0;
        text-align: center;
      }
      #d1-bars-wrap {
        position: absolute;
        top: 470px;
        left: 0;
        right: 0;
        height: 820px;
      }
      #d1-bars {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
      }
      #d1-stop {
        position: absolute;
        top: 1470px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 52px;
        font-weight: 800;
        opacity: 0;
      }
      #d1-tdee {
        position: absolute;
        top: 470px;
        left: 0;
        right: 0;
        text-align: center;
        opacity: 0;
      }
      #d1-tdee .word {
        font-size: 210px;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: var(--out);
        line-height: 1;
      }
      #d1-tdee-sub {
        position: absolute;
        top: 760px;
        left: 90px;
        right: 90px;
        text-align: center;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="d1-root" data-composition-id="deux-cotes" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div id="d1-scene" class="clip" data-start="0" data-duration="16" data-track-index="0">
        <div class="stage">
          <div id="d1-head">
            <div class="kicker">Un déficit calorique</div>
            <div class="title" style="margin-top: 18px">c'est deux côtés</div>
          </div>

          <div id="d1-bars-wrap">
            <div id="d1-n1" class="num">1</div>
            <div id="d1-n2" class="num">2</div>
            <div id="d1-bars"></div>
          </div>

          <div id="d1-stop">tout le monde s'arrête là</div>

          <div id="d1-tdee"><div class="word">TDEE</div></div>
          <div id="d1-tdee-sub" class="caption">
            tout ce que ton corps brûle<br>dans une journée
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const bar = SplitBar.mount("#d1-bars", {
        layout: "group",
        width: 240,
        height: 780,
        gap: 244,
        segments: [
          {
            key: "in",
            label: "CALORIES<br>QUI RENTRENT",
            pct: 80,
            color: "var(--in)",
          },
          {
            key: "out",
            label: "CALORIES<br>QUI SORTENT",
            pct: 92,
            color: "var(--out)",
          },
        ],
      });

      const IN = bar.nodes.in.seg;
      const OUT = bar.nodes.out.seg;

      // ---- 0:00-0:03 — le titre et les deux cases numérotées
      tl.from("#d1-head .kicker", { opacity: 0, y: 24, duration: 0.5 }, 0);
      tl.from("#d1-head .title", { opacity: 0, y: 30, duration: 0.55 }, 0.12);
      tl.from("#d1-n1", { opacity: 0, scale: 0.5, duration: 0.4, ease: "back.out(2)" }, 0.9);
      tl.from("#d1-n2", { opacity: 0, scale: 0.5, duration: 0.4, ease: "back.out(2)" }, 1.15);

      // ---- 0:03 — « les calories qui rentrent »
      tl.to(IN, { height: 512, duration: 0.7, ease: "power3.out" }, 2.8);
      bar.labels(tl, 3.0, ["in"]);

      // ---- 0:05 — « et les calories qui sortent »
      tl.to(OUT, { height: 596, duration: 0.7, ease: "power3.out" }, 4.8);
      bar.labels(tl, 5.0, ["out"]);

      // ---- 0:08 — « lui, il travaille le premier »
      tl.to(OUT, { opacity: 0.2, duration: 0.4 }, 7.0);
      tl.to(bar.nodes.out.label, { opacity: 0.2, duration: 0.4 }, 7.0);

      // ---- 0:10 — « et tout le monde s'arrête là » + croix sur le côté oublié
      tl.fromTo("#d1-stop", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4 }, 9.0);
      bar.mark(tl, 9.4, "out", "x", { color: "var(--bad)" });

      // ---- 0:12 — bascule : le côté oublié prend tout l'écran
      const swap = 11.2;
      tl.to([IN, bar.nodes.in.label, "#d1-n1", "#d1-n2", "#d1-stop", "#d1-head"], {
        opacity: 0,
        duration: 0.45,
        ease: "power2.in",
      }, swap);
      tl.to(bar.nodes.out.mark, { opacity: 0, scale: 0.6, duration: 0.35 }, swap);
      tl.to(bar.nodes.out.label, { opacity: 0, duration: 0.35 }, swap);
      tl.to(OUT, { opacity: 1, duration: 0.4 }, swap + 0.25);
      tl.to(OUT, { scaleY: 0.06, duration: 0.7, ease: "power2.inOut" }, swap + 0.45);
      tl.to(OUT, { opacity: 0, duration: 0.3 }, swap + 0.95);
      tl.to("#d1-tdee", { opacity: 1, duration: 0.5 }, swap + 0.75);
      tl.from("#d1-tdee .word", { scale: 0.7, duration: 0.6, ease: "back.out(1.6)" }, swap + 0.75);

      // ---- 0:15 — le sous-titre
      tl.to("#d1-tdee-sub", { opacity: 1, duration: 0.45 }, 13.2);
      tl.from("#d1-tdee-sub", { y: 22, duration: 0.45 }, 13.2);

      window.__timelines["deux-cotes"] = tl;
      })();
    </script>
  </body>
</html>
