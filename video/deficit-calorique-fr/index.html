<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Déclarée dans le document, pas dans kit.css : les HTML sont servis
         avec la racine du projet comme base, donc ce chemin est le seul que
         le lint et le runtime résolvent pareil (cf. commentaire kit.css). */
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      html,
      body {
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <!--
      Enchaînement de relecture uniquement : les 59 s d'animation bout à bout,
      pour vérifier le rythme. Le montage final se fait dans CapCut, où chaque
      composition est rendue séparément (npm run render:01 / :02 / :03) et posée
      aux timecodes du script.

      0:12  ->  01-deux-cotes         (17 s)
      0:32  ->  02-decoupe-tdee       (15 s)
      0:52  ->  03-les-trois-leviers  (27 s)
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="64" data-width="1080" data-height="1920">
      <div id="host-deux-cotes" data-composition-id="deux-cotes" class="clip" data-start="0" data-duration="16" data-track-index="0" data-composition-src="compositions/01-deux-cotes.html"></div>

      <div id="host-decoupe-tdee" data-composition-id="decoupe-tdee" class="clip" data-start="16" data-duration="16" data-track-index="0" data-composition-src="compositions/02-decoupe-tdee.html"></div>

      <div id="host-trois-leviers" data-composition-id="trois-leviers" class="clip" data-start="32" data-duration="32" data-track-index="0" data-composition-src="compositions/03-les-trois-leviers.html"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
