<!DOCTYPE html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="stylesheet" href="compositions/components/kit.css">
    <link rel="stylesheet" href="compositions/components/youbud.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/vendor/lucide.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 400 900;
        font-display: block;
      }
      /* « Lui, c'est James Smith » : un bonhomme à sa tête, qui bascule vers le logo NOW. */
      #i0-man { position: absolute; left: 300px; top: 620px; width: 480px; height: 560px; opacity: 0; transform-origin: 50% 60%; will-change: transform; }
      #i0-body { position: absolute; left: 0; top: 60px; width: 480px; height: 480px; color: var(--ink); }
      #i0-body svg.lucide { stroke-width: 1.6; }
      #i0-head { left: 152px; top: 0; width: 176px; height: 176px; transform-origin: 50% 100%; }
      #i0-head img { width: 290px; left: -66px; top: -94px; }
      #i0-who { position: absolute; left: 240px; top: 1210px; width: 600px; text-align: center; opacity: 0; will-change: transform; }
      #i0-who .yb-pill { background: #fff; box-shadow: 0 6px 0 #e5e5e0; font-size: 44px; color: var(--ink); }
      #i0-now { left: 400px; top: 720px; width: 280px; height: 280px; opacity: 0; transform-origin: 50% 50%; background: #fff; }
      #i0-now img { width: 100%; height: 100%; left: 0; top: 0; }
      #i0-nowlab { position: absolute; left: 240px; top: 1050px; width: 600px; text-align: center; opacity: 0; will-change: transform; }
      #i0-nowlab .yb-pill { background: #fff; box-shadow: 0 6px 0 #e5e5e0; font-size: 44px; color: var(--ink); letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <div id="i0-root" data-composition-id="creatine-i0-james" data-start="0" data-duration="1.62" data-width="1080" data-height="1920">
      <div id="i0-scene" class="clip" data-start="0" data-duration="1.62" data-track-index="0">
        <div class="stage">
          <div id="i0-man">
            <div id="i0-body"><i data-lucide="person-standing"></i></div>
            <div class="yb-emoji" id="i0-head"><img src="assets/img/james-head.png" alt=""></div>
          </div>
          <div id="i0-who"><span class="yb-pill">James Smith</span></div>
          <div class="yb-emoji" id="i0-now"><img src="assets/img/now-logo.png" alt=""></div>
          <div id="i0-nowlab"><span class="yb-pill">NOW</span></div>
        </div>
      </div>

      <!-- Le son : le bonhomme se pose, la bascule fait un whoosh, le logo tombe en bulle -->
      <audio id="i0-s-01" src="assets/sfx/soft_click.wav" data-start="0.0" data-duration="0.22" data-track-index="121" data-volume="1"></audio>
      <audio id="i0-s-02" src="assets/sfx/air-woosh.wav" data-start="0.75" data-duration="1.0" data-track-index="122" data-volume="0.35"></audio>
      <audio id="i0-s-03" src="assets/sfx/bloop.mp3" data-start="0.95" data-duration="0.63" data-track-index="123" data-volume="0.6"></audio>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        if (window.lucide) window.lucide.createIcons();
        var tl = gsap.timeline({ paused: true });

        // 0.00 « Lui » — le bonhomme arrive avec la tête de James, le nom dessous, il hoche la tête.
        tl.fromTo("#i0-man", { opacity: 0, scale: 0.4, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(1.4)" }, 0);
        tl.fromTo("#i0-who", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.2);
        tl.fromTo("#i0-head", { rotation: 0 }, { rotation: 7, duration: 0.14, ease: "power1.inOut", repeat: 3, yoyo: true, immediateRender: false }, 0.35);

        // 0.85 « James Smith » — bascule : le bonhomme part vers la gauche, le logo NOW prend sa place.
        tl.to("#i0-man", { x: -700, rotation: -8, opacity: 0, duration: 0.3, ease: "power2.in" }, 0.85);
        tl.to("#i0-who", { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, 0.85);
        tl.fromTo("#i0-now", { opacity: 0, x: 700, scale: 0.6, rotation: 20 }, { opacity: 1, x: 0, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(1.3)" }, 0.95);
        tl.fromTo("#i0-nowlab", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.15);

        // Tenue : rien ne bouge après 1.4, « Avec NOW » enchaîne sur I2.
        window.__timelines["creatine-i0-james"] = tl;
      })();
    </script>
  </body>
</html>
